<!-- Contenedor gris exterior que cubre toda el área del router-outlet -->
<div class="py-4 px-2 px-md-5 d-flex justify-content-center">
  <!-- Contenedor central de la tabla y el contenido -->
  <div class="w-100 shadow-sm p-4" style="max-width: 1200px; border-radius: 0; background-color: #d9d9d9;">

    <h2 class="mb-3">Lista de Usuarios</h2>

    <div *ngIf="errors" class="alert alert-danger rounded-0">
      <ul>
        <li *ngFor="let error of errors | keyvalue">
          <strong>{{ error.key }}:</strong> {{ error.value }}
        </li>
      </ul>
    </div>

    <div class="table-responsive" style="max-height: calc(80vh - 50px); overflow-y: auto;">
      <table class="table table-striped table-bordered custom-table">
        <thead class="custom-thead">
          <tr>
            <th class="text-center">ID</th>
            <th class="text-center">Nombre</th>
            <th class="text-center">Email</th>
            <th class="text-center">Rol</th>
            <th class="text-center">Editar</th>
            <th class="text-center">Borrar</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of usersPaginados">
            <td class="text-center">{{ user.id }}</td>
            <td class="text-center">{{ user.name }}</td>
            <td class="text-center">{{ user.email }}</td>
            <td class="text-center">{{ getRoleName(user.role_id) }}</td>
            <td class="text-center">
              <button class="btn btn-primary rounded-0" (click)="onEdit(user.id)">Editar</button>
            </td>
            <td class="text-center">
              <button class="btn btn-danger rounded-0" (click)="onDelete(user.id)">Borrar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="d-flex justify-content-center mt-3">
      <div class="border border-secondary bg-white px-4 py-2" style="border-radius: 0;">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-secondary btn-sm rounded-0" [disabled]="paginaActual === 1" (click)="anteriorPagina()">
            Anterior
          </button>
          <span class="fw-bold">Página {{ paginaActual }} de {{ totalPaginas }}</span>
          <button class="btn btn-secondary btn-sm rounded-0" [disabled]="paginaActual === totalPaginas" (click)="siguientePagina()">
            Siguiente
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
