<div class="container mt-3">
    <h2 class="mb-3">Lista de Usuarios</h2>
  
    <div *ngIf="errors" class="alert alert-danger">
      <ul>
        <li *ngFor="let error of errors | keyvalue">
          <strong>{{ error.key }}:</strong> {{ error.value }}
        </li>
      </ul>
    </div>
  
    <table class="table table-striped table-bordered">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Email</th>
          <th>Rol</th>
          <th>Editar</th>
          <th>Borrar</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.id }}</td>
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td>{{ getRoleName(user.role_id) }}</td>
          <td>
            <button class="btn btn-primary" (click)="onEdit(user.id)">Editar</button>
          </td>
          <td>
            <button class="btn btn-danger" (click)="onDelete(user.id)">Borrar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
