<div class="container d-flex justify-content-center align-items-center" style="margin-top: 3%; margin-bottom: 3%;">
  <div class="card p-4 shadow rounded-0" style="background-color: #d9d9d9; width: 400px; min-height: auto;">
    <h3 class="text-center mb-4">Editar Categoría</h3>

    <form class="form-signin" [formGroup]="categoriaForm" (ngSubmit)="onSubmit()">
      
      <div *ngIf="errors" class="alert alert-danger rounded-0">
        <ul>
          <li *ngFor="let error of errors | keyvalue">
            <strong>{{ error.key }}:</strong> {{ error.value }}
          </li>
        </ul>
      </div>

      <div class="mb-3">
        <label class="form-label">Nombre de la Categoría</label>
        <input
          type="text"
          class="form-control rounded-0"
          formControlName="nombre"
          placeholder="Ingrese un nombre"
        />
        <div
          *ngIf="categoriaForm.get('nombre')?.invalid && (categoriaForm.get('nombre')?.dirty || categoriaForm.get('nombre')?.touched)"
          class="text-danger mt-1"
        >
          El nombre es obligatorio.
        </div>
      </div>

      <hr>

      <div class="d-grid">
        <button
          type="submit"
          class="btn btn-primary btn-block rounded-0 login-button"
          [disabled]="categoriaForm.invalid"
        >
          Guardar Cambios
        </button>
      </div>

    </form>
  </div>
</div>
