<div class="container mt-3">
    <h2 class="text-center mb-3">Lista de Categorías</h2>
  
    <div *ngIf="errors" class="alert alert-danger">
      <ul>
        <li *ngFor="let error of errors | keyvalue">
          <strong>{{ error.key }}:</strong> {{ error.value }}
        </li>
      </ul>
    </div>
  
    <table class="table table-striped table-bordered">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Editar</th>
          <th>Borrar</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let categoria of categorias">
          <td>{{ categoria.id }}</td>
          <td>{{ categoria.nombre }}</td>
          <td>
            <button class="btn btn-primary" (click)="onEdit(categoria.id)">Editar</button>
          </td>
          <td>
            <button class="btn btn-danger" (click)="onDelete(categoria.id)">Borrar</button>
          </td>
        </tr>
      </tbody>
    </table>
  
    <a routerLink="/categoria/create" class="btn btn-success mt-3">Crear Categoría</a>
  </div>
