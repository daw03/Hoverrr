<div class="container mt-3">
  <h2 class="text-center mb-3">Lista de Categorías</h2>

  <div *ngIf="errors" class="alert alert-danger rounded-0">
    <ul>
      <li *ngFor="let error of errors | keyvalue">
        <strong>{{ error.key }}:</strong> {{ error.value }}
      </li>
    </ul>
  </div>

  <div class="table-responsive" style="max-height: calc(80vh - 50px); overflow-y: auto;">
    <table class="table table-striped table-bordered custom-table">
      <thead class="custom-thead">
        <tr>
          <th class="text-center">ID</th>
          <th class="text-center">Nombre</th>
          <th class="text-center">Editar</th>
          <th class="text-center">Borrar</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let categoria of categorias">
          <td class="text-center">{{ categoria.id }}</td>
          <td class="text-center">{{ categoria.nombre }}</td>
          <td class="text-center">
            <button class="btn btn-primary rounded-0" (click)="onEdit(categoria.id)">Editar</button>
          </td>
          <td class="text-center">
            <button class="btn btn-danger rounded-0" (click)="onDelete(categoria.id)">Borrar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <a routerLink="admin/categoria/create" class="btn btn-success mt-3 rounded-0 create-button">Crear Categoría</a>
</div>
