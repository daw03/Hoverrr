<div class="app-container">
  <nav class="navbar navbar-expand-lg" style="background-color: #37ffd7">
    <div class="container-fluid">
      <div class="hamburger-menu">
        <input id="menu__toggle" type="checkbox" />
        <label class="menu__btn" for="menu__toggle" style="z-index: 2">
          <span></span>
        </label>

        <ul class="menu__box" id="menuBox">
          <li><a class="menu__item" routerLink="">Inicio</a></li>
          <li><a class="menu__item" routerLink="/evento/index">Eventos</a></li>
          <li>
            <a *ngIf="isSignedIn" class="menu__item" routerLink="/evento/mine"
              >Mis eventos</a
            >
          </li>
          <li>
            <a *ngIf="isSignedIn" class="menu__item" routerLink="/evento/create"
              >Crear Eventos</a
            >
          </li>
          <li>
            <a *ngIf="!isSignedIn" class="menu__item" routerLink="/register"
              >Registrate</a
            >
          </li>
        </ul>
      </div>

      <div class="navbar-center-title">
        <a
          class="navbar-brand text-dark fs-1"
          style="font-family: 'Bodoni Moda', serif; font-weight: bold"
          >HOVERRR</a
        >
      </div>

      <button
        *ngIf="!isSignedIn"
        class="btn d-flex align-items-center"
        style="background-color: #d9d9d9"
        routerLink="/login"
      >
        <span class="me-2"> <b>Login</b></span>
        <i class="bi bi-person-circle fs-4"></i>
      </button>

      <div *ngIf="isSignedIn" class="dropdown">
        <button
          class="btn d-flex align-items-center"
          style="background-color: #d9d9d9"
          type="button"
          id="dropdownMenuButton"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          <span class="me-2">
            <b>{{ user.name }}</b></span
          >
          <i class="bi bi-person-circle fs-4"></i>
        </button>
        <ul
          class="dropdown-menu dropdown-menu-end"
          aria-labelledby="dropdownMenuButton"
        >
          <li><a class="dropdown-item" routerLink="/profile">Perfil</a></li>
          <li *ngIf="this.user.role_id == 2">
            <button
              class="dropdown-item"
              routerLink="/categoria/index"
              style="background-color: #39c94d; color: black"
            >
              Admin Panel
            </button>
          </li>

          <li>
            <button
              class="dropdown-item"
              (click)="signOut()"
              style="background-color: #f35353; color: black"
            >
              Cerrar Sesión
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <router-outlet></router-outlet>

  <footer
    class="pt-4"
    style="background-color: #868686; z-index: 0"
  >
    <div class="container">
      <div
        class="row mt-4 text-center"
        style="font-weight: bold; font-size: 1.1rem"
      >
        <div class="col-md-6 mb-3">
          <ul class="list-unstyled">
            <li>
              <a routerLink="" class="text-dark text-decoration-none">Inicio</a>
            </li>
            <li>
              <a routerLink="/evento/index" class="text-dark text-decoration-none"
                >Eventos</a
              >
            </li>
            <li>
              <a routerLink="/evento/mine" class="text-dark text-decoration-none"
                >Mis eventos</a
              >
            </li>
          </ul>
        </div>

        <div class="col-md-6 mb-3">
          <ul class="list-unstyled">
            <li>
              <a href="#" class="text-dark text-decoration-none">Instagram</a>
            </li>
            <li>
              <a href="#" class="text-dark text-decoration-none">YouTube</a>
            </li>
            <li>
              <a href="#" class="text-dark text-decoration-none">Facebook</a>
            </li>
          </ul>
        </div>
      </div>

      <hr class="border-dark" style="z-index: -1" />

      <div class="text-center pb-3">
        <p class="mb-0 text-dark">&copy; 2025 Derechos reservados a Hoverrr</p>
      </div>
    </div>
  </footer>
</div>
