<div class="container mt-2 mb-2">
  <div class="card shadow-lg rounded-0 overflow-hidden">
    <div class="bg-turquoise p-4 text-white d-flex justify-content-between align-items-center">
      <h2
        class="mb-0"
        style="font-family: 'Bodoni Moda', serif; font-weight: bold"
      >
        Gestión de Inscripciones
      </h2>
      <button class="btn btn-dark rounded-0" [routerLink]="['/evento/view', eventoId]">
        <i class="bi bi-arrow-left"></i> Atrás
      </button>
    </div>

    <div class="p-4 bg-light">
      <div class="bg-turquoise p-3 text-white mt-4">
        <h3 class="mb-0" style="font-family: 'Bodoni Moda', serif; font-weight: bold;">
          Editar Inscripciones
        </h3>
      </div>

      <div *ngIf="loading" class="text-center text-primary text-lg p-4">
        Cargando inscripciones...
      </div>
      <div *ngIf="error" class="alert alert-danger mt-4" role="alert">
        {{ error }}
      </div>

      <div *ngIf="!loading && !error">
        <div
          *ngIf="inscripciones.length === 0"
          class="alert alert-info mt-4"
          role="alert"
        >
          No hay inscripciones para este evento aún.
        </div>

        <div
          *ngIf="inscripciones.length > 0"
          class="overflow-x-auto shadow-lg rounded-0 mt-4"
        >
          <table class="table table-striped table-hover mb-0 text-center">
            <thead class="bg-light-subtle">
              <tr>
                <th
                  scope="col"
                  class="px-4 py-3 text-sm font-medium text-gray-700 uppercase tracking-wider rounded-top-left"
                >
                  Nombre de Usuario
                </th>
                <th
                  scope="col"
                  class="px-4 py-3 text-sm font-medium text-gray-700 uppercase tracking-wider"
                >
                  Estado
                </th>
                <th
                  scope="col"
                  class="px-4 py-3 text-sm font-medium text-gray-700 uppercase tracking-wider rounded-top-right"
                >
                  Borrar
                </th>
              </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
              <tr
                *ngFor="let inscripcion of inscripciones"
                class="hover:bg-light"
              >
                <td
                  class="px-4 py-3 whitespace-nowrap text-sm font-medium text-gray-900"
                >
                  {{ inscripcion.name }}
                </td>
                <td
                  class="px-4 py-3 whitespace-nowrap text-sm text-gray-700 cursor-pointer"
                  (click)="toggleEstadoInscripcion(inscripcion)"
                >
                  <span
                    [ngClass]="{
                      'bg-success-subtle text-success':
                        inscripcion.pivot.estado === 1,
                      'bg-danger-subtle text-danger':
                        inscripcion.pivot.estado === 0,
                      'bg-info-subtle text-info':
                        inscripcion.pivot.estado !== 0 &&
                        inscripcion.pivot.estado !== 1
                    }"
                    class="badge rounded-pill px-2 py-1"
                  >
                    {{ getEstadoText(inscripcion.pivot.estado) }}
                  </span>
                </td>
                <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-700">
                  <button
                    (click)="
                      borrarInscripcion(inscripcion.id, inscripcion.name)
                    "
                    class="btn btn-sm btn-danger rounded-0"
                  >
                    Borrar
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
